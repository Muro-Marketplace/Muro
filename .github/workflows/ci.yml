name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same branch. Saves minutes on PR churn.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: website

jobs:
  # ─── Fast gate: lint + typecheck + unit tests. Runs on every PR/push. ───
  check:
    name: lint + typecheck + unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Dummy values let the build + env.ts parse succeed without any real
      # infra. Tests that need specific env set it themselves.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOi_PLACEHOLDER_CI_ANON_KEY
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOi_PLACEHOLDER_CI_SVC_KEY
      NEXT_PUBLIC_SITE_URL: https://wallplace.co.uk

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - run: npm ci
      # Lint blocks CI. Rules set to "error" (e.g. no-raw-arrangement-type)
      # fail the build; the residual React Compiler / unused-vars warning
      # backlog does not, since eslint exits 0 when only warnings remain.
      # Locked by tests/integration/ci-lint-blocking.test.ts.
      - name: Lint
        run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      # 09 item 4.4. These three are part of `npm run check` and were NOT run
      # here, so every guard behind them was decoration: the public-route
      # allowlist, the one-email-entrypoint dependency rule, and the template
      # render pass all passed locally and gated nothing on a PR.
      #
      # Kept as separate steps rather than a single `npm run check` so a red
      # build names the gate that broke. ci-gates.test.ts derives the required
      # list from package.json's `check` script, so adding anything to `check`
      # without adding a step here fails the test.
      - name: Public-route allowlist
        run: npm run audit:allowlist
      - name: Dependency rules
        run: npm run depcheck
      - name: Email templates render
        run: npm run email:render

  # The Supabase advisor deliberately does NOT run here. It lives in
  # advisors-nightly.yml. See EXECUTION-DECISIONS D12 ruling 3: a clean advisor
  # run is not evidence of RLS health (it misses this codebase's leak class), fork
  # PRs get no secrets, and a per-PR job holding a prod management token widens
  # the blast radius. The blocking RLS gate is the pg_policies assertion, run via
  # the Supabase MCP pre-merge.

  # ─── Build + Playwright smoke. Runs on main + PRs. ───
  e2e:
    name: build + playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: check
    env:
      # Real project when the secrets exist, placeholders otherwise (D13.1). The
      # anon key is already public in the shipped browser bundle, so this exposes
      # nothing new, and it is what lets security-no-leaks.spec.ts assert against
      # real data instead of an empty app.
      #
      # The `||` fallback is deliberate: an unset secret expands to "" and
      # src/env.ts requires a valid URL, so a bare `secrets.*` reference would
      # break the *build* rather than the one spec that needs it. With the
      # fallback, a missing secret (or any fork PR, which never receives secrets)
      # leaves the placeholder in place and that spec skips loudly.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOi_PLACEHOLDER_CI_ANON_KEY' }}
      # Service-role key stays a placeholder. Nothing in the e2e suite needs it,
      # and a real one in CI would be a genuine escalation of blast radius.
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOi_PLACEHOLDER_CI_SVC_KEY
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      # src/lib/stripe.ts instantiates `new Stripe(...)` at module load,
      # so the build-time data-collection pass for /api/checkout (and
      # any route that imports it) needs *some* value here. The
      # placeholder never makes a real API call — Stripe only validates
      # the key when an actual request is dispatched.
      STRIPE_SECRET_KEY: sk_test_PLACEHOLDER_CI_KEY
      CI: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: website/playwright-report/
          retention-days: 7
