            - generic [ref=f119e277]:
              - generic [ref=f119e278]:
                - button "Who is this for?" [ref=f119e279] [cursor=pointer]
                - paragraph [ref=f119e282]: Cafés, restaurants, hotels, bars, offices, co-working spaces, clinics, retail. Any venue with walls and a sense of how they want them to feel.
              - generic [ref=f119e283]:
                - button "How is this different from just browsing artists?" [ref=f119e284] [cursor=pointer]
                - paragraph [ref=f119e287]: Browsing is free and works if you know what you want. Curated is for venues who want a Wallplace curator to do the picking and the artist matching.
              - generic [ref=f119e288]:
                - button "How long does it take?" [ref=f119e289] [cursor=pointer]
                - paragraph [ref=f119e292]: Most shortlists land within 5 business days of your brief. Bespoke projects start with a 30-minute scope call and the timeline is set from there.
              - generic [ref=f119e293]:
                - button "What's NOT included in the price?" [ref=f119e294] [cursor=pointer]
                - paragraph [ref=f119e297]: The artwork itself. Curated covers the curation. Getting the art on the wall (free QR-loan, paid loan, or outright purchase) is arranged separately.
              - generic [ref=f119e298]:
                - button "What if I don't love any of the shortlist?" [ref=f119e299] [cursor=pointer]
                - paragraph [ref=f119e302]: The £49 and £149 plans include one revision round. If nothing fits at all, we refund in full.
              - generic [ref=f119e303]:
                - button "How does the art actually get on the wall?" [ref=f119e304] [cursor=pointer]
                - paragraph [ref=f119e307]: "You pick from three placement methods: free QR-loan (the artist gets a share of QR sales, you pay nothing for the art), paid loan (a monthly fee to display), or outright purchase."
              - generic [ref=f119e308]:
                - button "Can I cancel a managed plan?" [ref=f119e309] [cursor=pointer]
                - paragraph [ref=f119e312]: Yes, any time, no notice period. You keep the last shortlist.
              - generic [ref=f119e313]:
                - button "Do you visit in person?" [ref=f119e314] [cursor=pointer]
                - paragraph [ref=f119e317]: Not on £49 to £199.99 plans. Bespoke projects include a scope call and, where it makes sense, an on-site walkthrough.
