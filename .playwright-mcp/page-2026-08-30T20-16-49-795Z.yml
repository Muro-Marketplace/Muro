          - generic [ref=f3e119]:
            - generic [ref=f3e120]:
              - paragraph [ref=f3e121]: Why it matters
              - heading "Walls that work for you" [level=2] [ref=f3e122]
              - paragraph [ref=f3e123]: Bare walls earn nothing today. Real art makes a space feel considered, gives customers something to look at, and quietly improves the experience of being in your venue. Any commercial upside on top is a bonus, not the whole point.
              - paragraph [ref=f3e124]: Revenue share is optional and agreed directly with the artist when you arrange a placement.
            - list [ref=f3e125]:
              - listitem [ref=f3e126]:
                - generic [ref=f3e127]: "01"
                - generic [ref=f3e128]:
                  - heading "Atmosphere" [level=3] [ref=f3e129]
                  - paragraph [ref=f3e130]: Curated work makes your space feel intentional. Better photos, longer dwell times, customers who come back.
              - listitem [ref=f3e131]:
                - generic [ref=f3e132]: "02"
                - generic [ref=f3e133]:
                  - heading "Story" [level=3] [ref=f3e134]
                  - paragraph [ref=f3e135]: Local artists give you something to talk about, a reason for regulars to bring friends and for press to cover you.
              - listitem [ref=f3e136]:
                - generic [ref=f3e137]: "03"
                - generic [ref=f3e138]:
                  - heading "Optional upside" [level=3] [ref=f3e139]
                  - paragraph [ref=f3e140]: When a customer scans a QR and buys, you can take an agreed share of the sale. Typical 10%. Off by default, on if you want it.
