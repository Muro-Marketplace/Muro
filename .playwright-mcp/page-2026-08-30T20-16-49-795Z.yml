              - paragraph [ref=f3e163]: Browse, enquire, and arrange, completely free for venues
          - generic [ref=f3e166]:
            - heading "Common questions" [level=2] [ref=f3e167]
            - generic [ref=f3e168]:
              - generic [ref=f3e169]:
                - button "Is it really free?" [ref=f3e170] [cursor=pointer]
                - paragraph [ref=f3e173]: Yes. Browsing portfolios, filtering artists, posting your space, and submitting enquiries are all free. Wallplace doesn't charge venues a platform fee.
              - generic [ref=f3e174]:
                - button "Do you handle installation?" [ref=f3e175] [cursor=pointer]
                - paragraph [ref=f3e178]: Installation is not included as standard, it's an optional paid add-on. Delivery and collection are arranged directly between you and the artist, with our support if needed.
              - generic [ref=f3e179]:
                - button "What if I don't like the art?" [ref=f3e180] [cursor=pointer]
                - paragraph [ref=f3e183]: You choose the work you enquire about. You're never sent artwork you haven't selected. If something isn't working after placement, you speak directly with the artist.
              - generic [ref=f3e184]:
                - button "Will it damage my walls?" [ref=f3e185] [cursor=pointer]
                - paragraph [ref=f3e188]: That's between you and the artist. We recommend discussing hanging methods before agreeing to a placement. Many artists use non-invasive fixings.
              - generic [ref=f3e189]:
                - button "What do my staff need to do?" [ref=f3e190] [cursor=pointer]
                - paragraph [ref=f3e193]: Point to the QR card if a customer asks. The artist provides this. Sales are handled automatically through Wallplace's payment infrastructure.
              - generic [ref=f3e194]:
                - button "How does revenue share work?" [ref=f3e195] [cursor=pointer]
                - paragraph [ref=f3e198]: Revenue share is an optional arrangement between you and the artist. A common split is 10% to the venue on any sale made from your space. You agree this directly when arranging placement.
              - generic [ref=f3e199]:
                - button "Is there a contract?" [ref=f3e200] [cursor=pointer]
                - paragraph [ref=f3e203]: No. Just a simple partnership agreement covering the basics. 30 days' notice to end at any time.
          - generic [ref=f3e205]:
            - heading "Discover art for your space. Free." [level=2] [ref=f3e206]
            - paragraph [ref=f3e207]: Browse portfolios, filter by style, and enquire directly with artists. No curation fee. No contract.
