            - heading "Common questions" [level=2] [ref=f52e253]
            - generic [ref=f52e254]:
              - generic [ref=f52e255]:
                - button "Who is this for?" [ref=f52e256] [cursor=pointer]
                - paragraph [ref=f52e259]: Cafés, restaurants, hotels, bars, offices, co-working spaces, clinics, retail. Any venue with walls and a sense of how they want them to feel.
              - generic [ref=f52e260]:
                - button "How is this different from just browsing artists?" [ref=f52e261] [cursor=pointer]
                - paragraph [ref=f52e264]: Browsing is free and works if you know what you want. Curated is for venues who want a Wallplace curator to do the picking and the artist matching.
              - generic [ref=f52e265]:
                - button "How long does it take?" [ref=f52e266] [cursor=pointer]
                - paragraph [ref=f52e269]: Most shortlists land within 5 business days of your brief. Bespoke projects start with a 30-minute scope call and the timeline is set from there.
              - generic [ref=f52e270]:
                - button "What's NOT included in the price?" [ref=f52e271] [cursor=pointer]
                - paragraph [ref=f52e274]: The artwork itself. Curated covers the curation. Getting the art on the wall (free QR-loan, paid loan, or outright purchase) is arranged separately.
              - generic [ref=f52e275]:
                - button "What if I don't love any of the shortlist?" [ref=f52e276] [cursor=pointer]
                - paragraph [ref=f52e279]: The £49 and £149 plans include one revision round. If nothing fits at all, we refund in full.
              - generic [ref=f52e280]:
                - button "How does the art actually get on the wall?" [ref=f52e281] [cursor=pointer]
                - paragraph [ref=f52e284]: "You pick from three placement methods: free QR-loan (the artist gets a share of QR sales, you pay nothing for the art), paid loan (a monthly fee to display), or outright purchase."
              - generic [ref=f52e285]:
                - button "Can I cancel a managed plan?" [ref=f52e286] [cursor=pointer]
                - paragraph [ref=f52e289]: Yes, any time, no notice period. You keep the last shortlist.
              - generic [ref=f52e290]:
                - button "Do you visit in person?" [ref=f52e291] [cursor=pointer]
                - paragraph [ref=f52e294]: Not on £49 to £199.99 plans. Bespoke projects include a scope call and, where it makes sense, an on-site walkthrough.
