          - generic [ref=f19e312]:
            - heading "Frequently asked questions" [level=2] [ref=f19e313]
            - generic [ref=f19e314]:
              - generic [ref=f19e315]:
                - button "Will my work actually sell?" [ref=f19e316] [cursor=pointer]
                - paragraph [ref=f19e319]: We can't guarantee sales, no honest platform can. What we do is connect you with venues that have real daily footfall and genuine interest in displaying art. Every piece gets a QR code linking to your sales page, and venues are matched to your style and medium. The rest is down to the work.
              - generic [ref=f19e320]:
                - button "Why should I pay for this?" [ref=f19e321] [cursor=pointer]
                - paragraph [ref=f19e324]: Because a gallery would take 40 to 60% of every sale on top of significant upfront costs. Wallplace gives you a platform fee of 5 to 15%, ongoing commercial visibility, sales infrastructure, and access to a growing network of venues, for less than the cost of a round of drinks per month.
              - generic [ref=f19e325]:
                - button "Do you handle delivery and installation?" [ref=f19e326] [cursor=pointer]
                - paragraph [ref=f19e329]: Logistics are your responsibility as standard. We do offer optional installation add-on packages for artists who want that support. Once a venue expresses interest and you agree to place work there, we'll guide you through the process.
              - generic [ref=f19e330]:
                - button "Can I still sell through other channels?" [ref=f19e331] [cursor=pointer]
                - paragraph [ref=f19e334]: Absolutely. Wallplace is an additional channel. You keep full control of your work and can sell through galleries, your own website, fairs, or anywhere else.
              - generic [ref=f19e335]:
                - button "What if I'm not accepted?" [ref=f19e336] [cursor=pointer]
                - paragraph [ref=f19e339]: We give feedback where we can, and you're welcome to reapply after three months. A stronger portfolio edit or a clearer artist statement can change the outcome.
              - generic [ref=f19e340]:
                - button "What sizes work best?" [ref=f19e341] [cursor=pointer]
                - paragraph [ref=f19e344]: Most venues suit work between A3 and A1. Once you're accepted and matched to a venue, we'll advise on sizing and presentation for that specific space.
              - generic [ref=f19e345]:
                - button "How does payment work when something sells?" [ref=f19e346] [cursor=pointer]
                - paragraph [ref=f19e349]: The buyer pays through Wallplace. The funds are held until the artwork is confirmed delivered (or 14 days pass without a buyer dispute, whichever comes first), then we transfer your share, minus the platform fee, straight to your linked bank account.
              - generic [ref=f19e350]:
                - button "What happens if I cancel?" [ref=f19e351] [cursor=pointer]
                - paragraph [ref=f19e354]: You can cancel with 30 days' notice, by email or from your account settings, and your membership stays active until the end of that period. You'll be responsible for collecting your work from venues within 30 days of cancelling. No cancellation fees, no hard feelings.
              - generic [ref=f19e355]:
                - button "Is my artwork protected?" [ref=f19e356] [cursor=pointer]
                - paragraph [ref=f19e359]: Every image on Wallplace is served at reduced resolution with compressed quality, good enough for browsing, not enough for reproduction. Right-click saving is disabled, and images cannot be dragged or selected. The original high-resolution file never leaves your hands, we only display a web-optimised version. Our Terms of Service prohibit unauthorised reproduction, and every sale is tracked and attributed to you as the creator.
          - generic [ref=f19e361]:
