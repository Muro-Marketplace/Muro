    - main [ref=f14e13]:
      - generic [ref=f14e14]:
        - generic [ref=f14e15]:
          - img "Art studio" [ref=f14e17]
          - generic [ref=f14e20]:
            - heading "About Wallplace" [level=1] [ref=f14e21]
            - paragraph [ref=f14e22]: Wallplace exists because thousands of incredible artworks sit in artists’ studios while thousands of bare walls in cafes could be transformed by them. We make the connection effortless.
        - generic [ref=f14e25]:
          - generic [ref=f14e26]:
            - heading "The Problem We Saw" [level=2] [ref=f14e27]
            - paragraph [ref=f14e28]: "Walk into most independent cafes, restaurants, or coworking spaces and you will see one of two things: bare walls, or mass-produced prints that could be in any city in the world. Meanwhile, there are some of the most talented emerging artists anywhere, people creating extraordinary work that deserves to be seen."
            - paragraph [ref=f14e29]: The problem is not a lack of supply or demand. It is the gap between them. Artists do not know which venues want art. Venues do not know where to find artists. And even when they do connect, selecting work, agreeing terms, and keeping the relationship healthy can be overwhelming for both sides.
          - generic [ref=f14e30]:
            - heading "What Wallplace Does" [level=2] [ref=f14e31]
            - paragraph [ref=f14e32]: Wallplace is a curated art placement service. We review and accept artists based on the quality of their work. We match them with venues that suit their style and help both sides agree on terms. Delivery and installation are arranged directly between the artist and the venue.
            - paragraph [ref=f14e33]: For artists, we provide exhibition space, exposure, and sales opportunities without the cost or commitment of a traditional gallery. For venues, we provide a rotating selection of original, high-quality artwork that transforms their space and creates talking points for their customers, all with no upfront cost and minimal effort.
        - generic [ref=f14e35]:
          - generic [ref=f14e36]:
            - heading "How Curation Works" [level=2] [ref=f14e37]
            - paragraph [ref=f14e38]: Quality is everything. We are not a marketplace where anyone can list their work. Every artist on Wallplace has been through our review process.
          - generic [ref=f14e39]:
            - generic [ref=f14e40]:
              - generic [ref=f14e41]: "01"
              - heading "Application" [level=3] [ref=f14e42]
              - paragraph [ref=f14e43]: Artists submit a portfolio of their best work along with a brief statement about their practice. We review every application personally.
            - generic [ref=f14e44]:
              - generic [ref=f14e45]: "02"
              - heading "Review" [level=3] [ref=f14e46]
              - paragraph [ref=f14e47]: Our team assesses work based on technical quality, originality, consistency, and suitability for display in commercial spaces. We are looking for work that holds up on a wall.
            - generic [ref=f14e48]:
              - generic [ref=f14e49]: "03"
              - heading "Onboarding" [level=3] [ref=f14e50]
              - paragraph [ref=f14e51]: Accepted artists work with us to photograph their portfolio, set pricing, and get matched with suitable venues. From there you and the venue arrange the details together.
        - generic [ref=f14e53]:
          - heading "What We Believe" [level=2] [ref=f14e54]
          - generic [ref=f14e55]:
            - generic [ref=f14e56]:
              - heading "Art belongs in everyday life" [level=3] [ref=f14e57]
              - paragraph [ref=f14e58]: You should not need to visit a gallery to experience great art. The cafe where you have your morning coffee, the restaurant where you celebrate an anniversary, the office where you spend your days. These spaces deserve beautiful, original work on their walls.
            - generic [ref=f14e59]:
              - heading "Quality over quantity" [level=3] [ref=f14e60]
              - paragraph [ref=f14e61]: We would rather have 50 exceptional artists than 500 mediocre ones. Our curation process is rigorous because the venues and buyers who trust us deserve the best. Every piece on Wallplace has been reviewed and approved.
            - generic [ref=f14e62]:
              - heading "Fair for everyone" [level=3] [ref=f14e63]
              - paragraph [ref=f14e64]: Artists keep the majority of every sale. Venues get art at no upfront cost. Buyers get original work at fair prices. We take a commission that sustains the service without exploiting anyone in the chain.
        - generic [ref=f14e67]:
          - heading "Original Work Only" [level=3] [ref=f14e68]
          - paragraph [ref=f14e69]: Every piece on Wallplace is original work by a real artist. We do not accept AI-generated art. Our artists invest time, skill, and vision into their craft, and we believe that distinction matters. When you see a photograph on Wallplace, you can trust that a human being stood behind the camera.
        - generic [ref=f14e72]:
          - generic [ref=f14e73]:
            - heading "For Artists" [level=2] [ref=f14e74]
            - paragraph [ref=f14e75]: Get your work seen by thousands of people in cafes, restaurants, and creative spaces. No gallery fees, no exclusivity.
            - link "Apply to Join" [ref=f14e76] [cursor=pointer]:
              - /url: /apply
          - generic [ref=f14e77]:
            - heading "For Venues" [level=2] [ref=f14e78]
            - paragraph [ref=f14e79]: Transform your space with original artwork at no upfront cost. We curate the artists, match them to your venue, and help you agree the terms. You and the artist arrange delivery and installation together.
            - link "Get Art for Your Space" [ref=f14e80] [cursor=pointer]:
              - /url: /venues
