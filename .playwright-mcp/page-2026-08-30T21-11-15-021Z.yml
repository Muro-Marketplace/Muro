          - generic [ref=f46e529]:
            - heading "About the Artist" [level=2] [ref=f46e530]
            - paragraph [ref=f46e532]: "I’ve always been someone who wants to see as much of the world as possible. Travel, nature, history, hiking, sport, and photography all feed into the same thing for me: curiosity. I like places that have a bit of atmosphere to them, whether that’s a dramatic mountain road, a windswept coastline, a quiet village, or a historic city street. My photography usually starts with that feeling. I’m less interested in creating overly polished images and more interested in capturing places as they felt in the moment. I like photos that make you want to stop for a second, look a little longer, and imagine being there. A lot of my work comes from time spent travelling and exploring outdoors. I’m drawn to landscapes, wildlife, old buildings, remote places, and scenes that feel connected to memory or adventure. For me, photography is a way of holding onto those moments and sharing them with other people."
            - button "Read more" [ref=f46e533] [cursor=pointer]
