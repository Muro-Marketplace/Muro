          - generic [ref=f79e192]:
            - heading "About the Artist" [level=2] [ref=f79e193]
            - paragraph [ref=f79e195]: My work explores the relationship between structure and spontaneity — the tension between what is controlled and what is left to unfold. Working primarily with layered textures and restrained palettes, I’m interested in how subtle shifts in form, tone, and space can evoke emotion without relying on explicit narrative. Each piece begins with a loose framework, but the final outcome is guided by instinct — allowing imperfections, movement, and disruption to shape the composition. I’m particularly drawn to the way art exists within environments. A piece is never isolated; it interacts with the architecture, the light, and the people moving around it. This dialogue between artwork and space is central to my practice. Ultimately, my work invites a slower way of looking — encouraging the viewer to pause, reflect, and find their own meaning within the layers.
            - button "Read more" [ref=f79e196] [cursor=pointer]
